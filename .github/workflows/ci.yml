name: CI Pipeline

# Déclenchement automatique à chaque push sur la branche main 
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  code-quality-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      # Valide que ton requirements.txt est correct
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx
        
    - name: Smoke Test (Test de syntaxe)
      # Vérifie que le code compile et que les imports fonctionnent
      # C'est le "Test unitaire" minimal pour valider le critère 
      run: |
        python -m compileall src/
    
    - name: Test API Import
      # Vérifie que l'API peut démarrer (sans la lancer réellement)
      run: |
        export ENV="TEST"
        # On essaie juste d'importer l'objet app pour voir si ça crash
        python -c "from src.api.main import app; print('API Import Successful')"